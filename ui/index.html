<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RAG Chat</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f0f2f5;
      display: flex;
      flex-direction: column;
      height: 100vh;
      color: #1a1a1a;
    }

    header {
      background: #1c1c2e;
      color: #fff;
      padding: 14px 24px;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    header h1 { font-size: 1.1rem; font-weight: 600; }
    #store-info { font-size: 0.75rem; opacity: 0.6; margin-left: auto; }

    #key-area {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-left: 16px;
    }
    #key-input {
      background: rgba(255,255,255,0.1);
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 6px;
      color: #fff;
      font-size: 0.78rem;
      padding: 5px 10px;
      width: 180px;
      outline: none;
    }
    #key-input::placeholder { color: rgba(255,255,255,0.4); }
    #key-input:focus { border-color: rgba(255,255,255,0.5); }
    #key-status {
      font-size: 0.75rem;
      padding: 4px 8px;
      border-radius: 4px;
      white-space: nowrap;
    }
    #key-status.unlocked { background: rgba(255,255,255,0.1); color: rgba(255,255,255,0.5); }
    #key-status.locked   { background: #22c55e22; color: #86efac; }
    #key-status.denied   { background: #ef444422; color: #fca5a5; }

    main {
      flex: 1;
      display: flex;
      overflow: hidden;
    }

    /* ---- sidebar ---- */
    aside {
      width: 280px;
      background: #fff;
      border-right: 1px solid #e0e0e0;
      display: flex;
      flex-direction: column;
      padding: 16px;
      gap: 12px;
    }
    aside h2 { font-size: 0.85rem; font-weight: 600; color: #555; text-transform: uppercase; letter-spacing: .5px; }
    #drop-zone {
      border: 2px dashed #c0c0c0;
      border-radius: 8px;
      padding: 20px;
      text-align: center;
      font-size: 0.8rem;
      color: #888;
      cursor: pointer;
      transition: border-color .2s, background .2s;
    }
    #drop-zone.drag-over { border-color: #4f6ef7; background: #eef1ff; }
    #file-input { display: none; }
    #upload-btn {
      background: #4f6ef7;
      color: #fff;
      border: none;
      border-radius: 6px;
      padding: 9px;
      cursor: pointer;
      font-size: 0.85rem;
      font-weight: 600;
    }
    #upload-btn:disabled { opacity: 0.5; cursor: not-allowed; }
    #file-list { font-size: 0.78rem; color: #444; flex: 1; overflow-y: auto; }
    #file-list li { padding: 3px 0; list-style: none; border-bottom: 1px solid #f0f0f0; }
    #upload-status { font-size: 0.78rem; color: #4f6ef7; min-height: 18px; }

    /* ---- chat area ---- */
    #chat-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 20px 24px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .msg {
      max-width: 780px;
      width: fit-content;
      padding: 12px 16px;
      border-radius: 12px;
      font-size: 0.9rem;
      line-height: 1.55;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .msg.user   { background: #4f6ef7; color: #fff; align-self: flex-end; border-bottom-right-radius: 4px; }
    .msg.bot    { background: #fff; border: 1px solid #e0e0e0; align-self: flex-start; border-bottom-left-radius: 4px; }
    .msg.system { background: #fff7e0; border: 1px solid #ffe58f; align-self: center; font-size: 0.8rem; color: #7a5c00; }

    .citations {
      margin-top: 10px;
      font-size: 0.76rem;
      color: #666;
      border-top: 1px solid #eee;
      padding-top: 8px;
    }
    .citations summary { cursor: pointer; font-weight: 600; color: #4f6ef7; }
    .citations li { margin: 4px 0 0 12px; }

    .hallucination-warning {
      margin-top: 8px;
      font-size: 0.76rem;
      color: #c0392b;
      background: #fdf0ef;
      border-left: 3px solid #e74c3c;
      padding: 6px 10px;
      border-radius: 4px;
    }
    .hallucination-warning.rejection {
      color: #7d1a00;
      background: #fff0eb;
      border-left-color: #c0392b;
      font-weight: 600;
    }
    .hallucination-warning.consistency {
      color: #7a4f00;
      background: #fffbe6;
      border-left-color: #f0a500;
    }

    #input-row {
      padding: 14px 24px;
      background: #fff;
      border-top: 1px solid #e0e0e0;
      display: flex;
      gap: 10px;
    }
    #user-input {
      flex: 1;
      border: 1px solid #d0d0d0;
      border-radius: 8px;
      padding: 10px 14px;
      font-size: 0.9rem;
      resize: none;
      outline: none;
      font-family: inherit;
    }
    #user-input:focus { border-color: #4f6ef7; }
    #send-btn {
      background: #4f6ef7;
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 10px 20px;
      cursor: pointer;
      font-size: 0.9rem;
      font-weight: 600;
      align-self: flex-end;
    }
    #send-btn:disabled { opacity: 0.5; cursor: not-allowed; }

    .spinner { display: inline-block; animation: spin 1s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>

<header>
  <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
  <h1>RAG Pipeline</h1>
  <div id="key-area">
    <input id="key-input" type="password" placeholder="API key (if required)" autocomplete="off" />
    <span id="key-status" class="unlocked">no key</span>
  </div>
  <span id="store-info">Loading…</span>
</header>

<main>
  <aside>
    <h2>Knowledge Base</h2>
    <div id="drop-zone">
      Drop PDF files here<br/>or click to browse
      <input type="file" id="file-input" accept=".pdf" multiple />
    </div>
    <button id="upload-btn" disabled>Upload</button>
    <span id="upload-status"></span>
    <h2>Ingested Files</h2>
    <ul id="file-list"></ul>
  </aside>

  <div id="chat-container">
    <div id="messages">
      <div class="msg system">Upload PDF files on the left, then ask questions about their content.</div>
    </div>
    <div id="input-row">
      <textarea id="user-input" rows="2" placeholder="Ask a question about your documents…"></textarea>
      <button id="send-btn">Send</button>
    </div>
  </div>
</main>

<script>
const API = '';  // same origin

// ---- API key ----
const keyInput  = document.getElementById('key-input');
const keyStatus = document.getElementById('key-status');

// Restore saved key from localStorage so the user doesn't retype on refresh
keyInput.value = localStorage.getItem('rag_api_key') || '';
updateKeyStatus();

keyInput.addEventListener('input', () => {
  localStorage.setItem('rag_api_key', keyInput.value);
  updateKeyStatus();
});

function getKey() { return keyInput.value.trim(); }

function updateKeyStatus() {
  if (getKey()) {
    keyStatus.textContent = 'key set';
    keyStatus.className = 'locked';
  } else {
    keyStatus.textContent = 'no key';
    keyStatus.className = 'unlocked';
  }
}

// Returns headers object — always includes Content-Type for JSON calls,
// and adds X-API-Key if the user has entered one.
function authHeaders(extra = {}) {
  const h = { ...extra };
  if (getKey()) h['X-API-Key'] = getKey();
  return h;
}

// ---- health poll ----
async function refreshHealth() {
  try {
    const r = await fetch(`${API}/health`);
    const d = await r.json();
    document.getElementById('store-info').textContent =
      `${d.chunks_in_store} chunks · ${d.files_ingested.length} file(s)`;
    const ul = document.getElementById('file-list');
    ul.innerHTML = d.files_ingested.map(f => `<li>${f}</li>`).join('');
  } catch { document.getElementById('store-info').textContent = 'unavailable'; }
}
refreshHealth();

// ---- file upload ----
const dropZone   = document.getElementById('drop-zone');
const fileInput  = document.getElementById('file-input');
const uploadBtn  = document.getElementById('upload-btn');
const uploadStatus = document.getElementById('upload-status');
let pendingFiles = [];

dropZone.addEventListener('click', () => fileInput.click());
dropZone.addEventListener('dragover', e => { e.preventDefault(); dropZone.classList.add('drag-over'); });
dropZone.addEventListener('dragleave', () => dropZone.classList.remove('drag-over'));
dropZone.addEventListener('drop', e => {
  e.preventDefault(); dropZone.classList.remove('drag-over');
  setPending([...e.dataTransfer.files].filter(f => f.name.endsWith('.pdf')));
});
fileInput.addEventListener('change', () => setPending([...fileInput.files]));

function setPending(files) {
  pendingFiles = files;
  uploadBtn.disabled = files.length === 0;
  dropZone.textContent = files.length
    ? files.map(f => f.name).join(', ')
    : 'Drop PDF files here or click to browse';
}

uploadBtn.addEventListener('click', async () => {
  if (!pendingFiles.length) return;
  uploadBtn.disabled = true;
  uploadStatus.textContent = 'Uploading…';
  const fd = new FormData();
  pendingFiles.forEach(f => fd.append('files', f));
  try {
    const r = await fetch(`${API}/api/ingest`, { method: 'POST', headers: authHeaders(), body: fd });
    const d = await r.json();
    if (!r.ok) {
      if (r.status === 403) throw new Error('Invalid or missing API key — check the key field in the header.');
      throw new Error(d.detail || r.statusText);
    }
    uploadStatus.textContent = `Done: ${d.chunks_created} chunks from ${d.files_processed} file(s)`;
    setPending([]);
    fileInput.value = '';
    refreshHealth();
  } catch (e) {
    uploadStatus.textContent = `Error: ${e.message}`;
  } finally {
    uploadBtn.disabled = false;
  }
});

// ---- chat ----
const messagesEl = document.getElementById('messages');
const inputEl    = document.getElementById('user-input');
const sendBtn    = document.getElementById('send-btn');

function addMsg(role, html) {
  const div = document.createElement('div');
  div.className = `msg ${role}`;
  div.innerHTML = html;
  messagesEl.appendChild(div);
  messagesEl.scrollTop = messagesEl.scrollHeight;
  return div;
}

function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

async function sendQuery() {
  const text = inputEl.value.trim();
  if (!text) return;

  inputEl.value = '';
  sendBtn.disabled = true;
  addMsg('user', escHtml(text));

  const thinking = addMsg('bot', '<span class="spinner">⟳</span> Thinking…');

  try {
    const r = await fetch(`${API}/api/query`, {
      method: 'POST',
      headers: authHeaders({ 'Content-Type': 'application/json' }),
      body: JSON.stringify({ query: text, top_k: 5 }),
    });
    const d = await r.json();
    if (!r.ok) {
      if (r.status === 403) {
        keyStatus.textContent = 'wrong key';
        keyStatus.className = 'denied';
        throw new Error('Invalid or missing API key — check the key field in the header.');
      }
      throw new Error(d.detail || r.statusText);
    }
    if (getKey()) { keyStatus.textContent = 'key set'; keyStatus.className = 'locked'; }

    let html = escHtml(d.answer);

    if (d.citations && d.citations.length) {
      const items = d.citations.map(c =>
        `<li><strong>${escHtml(c.source)}</strong> p.${c.page ?? '?'} — score ${c.score} — "${escHtml(c.text_snippet.slice(0,120))}…"</li>`
      ).join('');
      html += `<details class="citations"><summary>Sources (${d.citations.length})</summary><ul>${items}</ul></details>`;
    }

    if (d.answer_rejected) {
      html += `<div class="hallucination-warning rejection"><strong>Answer rejected:</strong> Too many claims could not be verified against the source documents.</div>`;
    } else {
      if (d.hallucination_warnings && d.hallucination_warnings.length) {
        const warns = d.hallucination_warnings.map(w => `<li>${escHtml(w)}</li>`).join('');
        html += `<div class="hallucination-warning"><strong>Unverified sentences (no supporting quote found):</strong><ul>${warns}</ul></div>`;
      }
      if (d.consistency_warnings && d.consistency_warnings.length) {
        const warns = d.consistency_warnings.map(w => `<li>${escHtml(w)}</li>`).join('');
        html += `<div class="hallucination-warning consistency"><strong>Consistency issues (two independent answers disagreed):</strong><ul>${warns}</ul></div>`;
      }
    }

    thinking.innerHTML = html;
  } catch (e) {
    thinking.innerHTML = `<span style="color:red">Error: ${escHtml(e.message)}</span>`;
  } finally {
    sendBtn.disabled = false;
    inputEl.focus();
  }
}

sendBtn.addEventListener('click', sendQuery);
inputEl.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendQuery(); }
});
</script>
</body>
</html>
